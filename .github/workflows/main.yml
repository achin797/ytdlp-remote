name: YouTube Download
on:
  workflow_dispatch:
    inputs:
      url:
        description: Video or playlist URL
        required: true
      args:
        description: Extra yt-dlp args (e.g. -f bestaudio -x --audio-format mp3)
        required: false
        default: ""

jobs:
  dl:
    # Only the repo owner can run this
    if: github.actor == 'achin797'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # yt-dlp needs a JS runtime to solve YouTube's challenges
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + PO token plugin + ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: Start PO token server
        run: |
          docker run -d --name bgutil -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 5

      - name: Write cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then echo "YT_COOKIES secret missing"; exit 1; fi
          # Accept raw cookies.txt text (pasted) or base64
          if printf '%s' "$YT_COOKIES" | grep -q $'\t'; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
          else
            printf '%s' "$YT_COOKIES" | base64 -d > cookies.txt
          fi

      - name: Download
        env:
          URL: ${{ inputs.url }}
          ARGS: ${{ inputs.args }}
        run: |
          mkdir -p out
          yt-dlp --cookies cookies.txt \
            -o "out/%(title).150B - %(id)s.%(ext)s" \
            $ARGS "$URL"

      - name: Remove cookies
        if: always()
        run: rm -f cookies.txt

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ inputs.url }}
        run: |
          gh release create "dl-${{ github.run_id }}" out/* \
            --repo "${{ github.repository }}" \
            --title "Download ${{ github.run_id }}" \
            --notes "$URL"
